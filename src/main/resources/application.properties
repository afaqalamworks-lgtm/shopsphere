spring.application.name=ShopSphere
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere
spring.datasource.username=shopsphere_user
spring.datasource.password=set-in-secrets-file

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=placeholder-set-in-secrets-file-0123456789
jwt.expiration-ms=86400000
server.error.include-message=always