<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopSphere</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        input { padding: 8px; margin: 4px 4px 4px 0; border: 1px solid #ccc; border-radius: 4px; }
        input.qty { width: 60px; }
        button { padding: 8px 14px; border: 0; border-radius: 4px; background: #2d6cdf; color: #fff; cursor: pointer; }
        button.danger { background: #c0392b; margin-left: 4px; }
        button:disabled { background: #aaa; cursor: default; }
        #msg { min-height: 22px; font-weight: bold; margin-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<header>
    <h2>ShopSphere</h2>
    <div><span id="who"></span> <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button></div>
</header>

<main>
    <div id="msg"></div>

    <div id="authCard" class="card">
        <h3>Register</h3>
        <input id="rName" placeholder="Full name">
        <input id="rEmail" placeholder="Email">
        <input id="rPass" type="password" placeholder="Password (8+ characters)">
        <button onclick="register()">Register</button>

        <h3>Login</h3>
        <input id="lEmail" placeholder="Email">
        <input id="lPass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="adminCard" class="card hidden">
        <h3>Admin: add a product</h3>
        <input id="pName" placeholder="Name">
        <input id="pDesc" placeholder="Description">
        <input id="pPrice" type="number" step="0.01" min="0.01" placeholder="Price">
        <input id="pStock" type="number" min="0" placeholder="Stock">
        <button onclick="addProduct()">Add product</button>
    </div>

    <h3>Products</h3>
    <div id="products" class="grid"></div>
    <p>
        <button id="prev" onclick="changePage(-1)">Previous</button>
        <span id="pageInfo"></span>
        <button id="next" onclick="changePage(1)">Next</button>
    </p>

    <div id="ordersCard" class="hidden">
        <h3>My orders</h3>
        <div id="orders"></div>
    </div>
</main>

<script>
    let token = localStorage.getItem('token');
    let page = 0;
    const $ = id => document.getElementById(id);

    function say(text, good) {
      $('msg').textContent = text;
      $('msg').style.color = good ? 'green' : 'crimson';
    }

    async function call(path, method, body) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      let data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) {
        if (res.status === 401 && token) {
          logout();
          throw new Error('Session expired. Please log in again.');
        }
        if (res.status === 400) throw new Error('Please check your input.');
        if (res.status === 403) throw new Error('You are not allowed to do that.');
        throw new Error((data && data.message) || ('Error ' + res.status));
      }
      return data;
    }

    async function register() {
      try {
        await call('/api/auth/register', 'POST',
          { fullName: $('rName').value, email: $('rEmail').value, password: $('rPass').value });
        say('Registered! Now log in.', true);
      } catch (e) { say(e.message, false); }
    }

    async function login() {
      try {
        const data = await call('/api/auth/login', 'POST',
          { email: $('lEmail').value, password: $('lPass').value });
        token = data.token;
        localStorage.setItem('token', token);
        say('Logged in.', true);
        updateUI();
      } catch (e) { say(e.message, false); }
    }

    function logout() {
      token = null;
      localStorage.removeItem('token');
      updateUI();
    }

    function readToken() {
      try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
    }

    function isAdmin() {
      const info = token ? readToken() : null;
      return !!info && info.role === 'ADMIN';
    }

    function updateUI() {
      const info = token ? readToken() : null;
      if (token && !info) { token = null; localStorage.removeItem('token'); }
      $('authCard').classList.toggle('hidden', !!info);
      $('logoutBtn').classList.toggle('hidden', !info);
      $('adminCard').classList.toggle('hidden', !isAdmin());
      $('who').textContent = info ? info.sub + ' (' + info.role + ')' : '';
      loadProducts();
      loadOrders();
    }

    async function loadProducts() {
      try {
        const data = await call('/api/products?page=' + page + '&size=6', 'GET');
        const box = $('products');
        box.innerHTML = '';
        data.content.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          const title = document.createElement('b');
          title.textContent = p.name;
          const desc = document.createElement('p');
          desc.textContent = p.description || '';
          const info = document.createElement('p');
          info.textContent = '$' + p.price + ' | in stock: ' + p.stock;
          card.append(title, desc, info);

          if (token) {
            const qty = document.createElement('input');
            qty.type = 'number';
            qty.min = 1;
            qty.value = 1;
            qty.className = 'qty';
            const btn = document.createElement('button');
            btn.textContent = 'Order';
            btn.disabled = p.stock < 1;
            btn.onclick = () => placeOrder(p.id, parseInt(qty.value, 10));
            card.append(qty, btn);
          }
          if (isAdmin()) {
            const del = document.createElement('button');
            del.textContent = 'Delete';
            del.className = 'danger';
            del.onclick = () => deleteProduct(p.id, p.name);
            card.append(del);
          }
          box.appendChild(card);
        });
        $('pageInfo').textContent = 'Page ' + (data.number + 1) + ' of ' + Math.max(data.totalPages, 1);
        $('prev').disabled = data.first;
        $('next').disabled = data.last;
      } catch (e) { say(e.message, false); }
    }

    function changePage(n) { page += n; loadProducts(); }

    async function placeOrder(productId, quantity) {
      if (!quantity || quantity < 1) { say('Enter a quantity of 1 or more.', false); return; }
      try {
        const order = await call('/api/orders', 'POST',
          { items: [{ productId: productId, quantity: quantity }] });
        say('Order #' + order.id + ' placed. Total: $' + order.total, true);
        loadProducts();
        loadOrders();
      } catch (e) { say(e.message, false); }
    }

    async function addProduct() {
      try {
        const p = await call('/api/products', 'POST', {
          name: $('pName').value,
          description: $('pDesc').value,
          price: parseFloat($('pPrice').value),
          stock: parseInt($('pStock').value, 10)
        });
        say('Product "' + p.name + '" added.', true);
        ['pName', 'pDesc', 'pPrice', 'pStock'].forEach(id => $(id).value = '');
        loadProducts();
      } catch (e) { say(e.message, false); }
    }

    async function deleteProduct(id, name) {
      if (!confirm('Delete "' + name + '"?')) return;
      try {
        await call('/api/products/' + id, 'DELETE');
        say('Product deleted.', true);
        loadProducts();
      } catch (e) { say(e.message, false); }
    }

    async function loadOrders() {
      const box = $('orders');
      box.innerHTML = '';
      if (!token) { $('ordersCard').classList.add('hidden'); return; }
      $('ordersCard').classList.remove('hidden');
      try {
        const list = await call('/api/orders', 'GET');
        if (list.length === 0) { box.textContent = 'No orders yet.'; return; }
        list.forEach(o => {
          const div = document.createElement('div');
          div.className = 'card';
          const lines = o.items.map(i => i.quantity + ' x ' + i.productName).join(', ');
          div.textContent = '#' + o.id + ' | ' + o.status + ' | $' + o.total + ' | ' + lines;
          box.appendChild(div);
        });
      } catch (e) { say(e.message, false); }
    }

    updateUI();
</script>
</body>
</html>
